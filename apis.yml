aid: kickpay
name: Kickpay
description: >-
  Kickpay is an intelligent finance platform for e-commerce and hardware brands
  that unlocks capital tied up in inventory. It plugs into a company's data
  sources — fulfillment centers, e-commerce sales channels, and bank accounts —
  to see historic sales, then finances the manufacturing cost of each SKU it
  estimates will sell within a reasonable window (typically around 16 weeks).
  Kickpay can fund the brand directly or pay the manufacturer to purchase more
  inventory, and the brand only pays Kickpay back as units ship: when a unit
  ships from the fulfillment center, Kickpay activates an ACH payment for the
  manufacturing price plus a fixed fee. It provides smart daily servicing and
  reporting, distinguishes customer shipments from internal stock movements, and
  uses prediction tooling to forecast future sales and cash flow so it can
  underwrite startups with as little as three months of sales history. Kickpay
  was backed by Canaan Partners and DCVC. This profile is maintained in the API
  Evangelist network; Kickpay publishes no public developer API, documentation,
  or SDKs, and the enrichment pipeline found no machine-readable API surface.
